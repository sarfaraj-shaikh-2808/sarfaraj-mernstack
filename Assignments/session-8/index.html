<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Task 1: Viewport -->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Card</title>

    <style>
        /* =====================================
           Basic Page Style
           ===================================== */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }


        /* =====================================
           Product Card
           ===================================== */

        .product-card {
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: row;

            background-color: white;

            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 25px;

            gap: 30px;
        }


        /* Product Image */

        .product-image {
            width: 350px;
            height: 300px;

            object-fit: cover;

            border-radius: 8px;
        }


        /* Product Details */

        .product-details {
            flex: 1;
        }

        .product-details h1 {
            font-size: 32px;
        }

        .product-details p {
            font-size: 18px;
            line-height: 1.5;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
        }

        .buy-button {
            background-color: #2874f0;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 12px 25px;

            font-size: 16px;

            cursor: pointer;
        }


        /* =====================================
           Breakpoint 1: 1200px
           Large Desktop
           ===================================== */

        @media only screen and (max-width: 1200px) {

            .product-card {
                padding: 22px;
            }

            .product-details h1 {
                font-size: 30px;
            }

            .product-details p {
                font-size: 17px;
            }

        }


        /* =====================================
           Breakpoint 2: 900px
           Tablet
           ===================================== */

        @media only screen and (max-width: 900px) {

            .product-card {
                padding: 18px;
                gap: 20px;
            }

            .product-image {
                width: 280px;
                height: 250px;
            }

            .product-details h1 {
                font-size: 26px;
            }

            .product-details p {
                font-size: 16px;
            }

        }


        /* =====================================
           Breakpoint 3: 600px
           Mobile
           ===================================== */

        @media only screen and (max-width: 600px) {

            /* Change horizontal layout to vertical */
            .product-card {
                flex-direction: column;

                padding: 15px;

                gap: 15px;
            }

            /* Image comes on top */
            .product-image {
                width: 100%;
                height: auto;
            }

            .product-details h1 {
                font-size: 22px;
            }

            .product-details p {
                font-size: 15px;
            }

            .price {
                font-size: 21px;
            }

            .buy-button {
                width: 100%;
            }

        }
    </style>
</head>


<body>

    <h1>Responsive Flipkart Product Card</h1>

    <div class="product-card">

        <!-- Product Image -->

        <img class="product-image" src="images.jpg" alt="Smartphone">


        <!-- Product Details -->

        <div class="product-details">

            <h1>Samsung Galaxy Smartphone</h1>

            <p>
                Powerful smartphone with a high-quality camera,
                fast processor and long-lasting battery.
            </p>

            <p class="price">
                ₹25,999
            </p>

            <p>
                ⭐ 4.5 Rating
            </p>

            <button class="buy-button">
                Buy Now
            </button>

        </div>

    </div>

</body>

</html>
