<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review and Food Order Forms</title>
</head>

<body>

    <!-- Task 1, 2 and 3: Product Review Form -->

    <h1>Flipkart-Style Product Review</h1>

    <form method="POST">

        <!-- Username -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <br><br>

        <!-- Rating -->
        <label for="rating">Rating:</label>
        <select id="rating" name="rating" required>
            <!-- This option cannot be selected as a valid rating -->
            <option value="" selected disabled>Select Rating</option>
            <option value="1">1 Star</option>
            <option value="2">2 Stars</option>
            <option value="3">3 Stars</option>
            <option value="4">4 Stars</option>
            <option value="5">5 Stars</option>
        </select>

        <br><br>

        <!-- Review -->
        <label for="review">Review:</label>
        <br>
        <textarea id="review" name="review" rows="5" cols="40" minlength="20" required
            placeholder="Write at least 20 characters..."></textarea>

        <br><br>

        <button type="submit">Submit Review</button>

    </form>


    <hr>


    <!-- Task 4 and 5: Food Order Form -->

    <h1>Zomato-Style Food Order Form</h1>

    <form>

        <!-- User Name -->
        <label for="foodUserName">User Name:</label>
        <input type="text" id="foodUserName" name="foodUserName" required>

        <br><br>

        <!-- Food Item -->
        <label for="foodItem">Food Item:</label>
        <select id="foodItem" name="foodItem" required>
            <option value="" selected disabled>Select Food Item</option>
            <option value="biryani">Chicken Biryani</option>
            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
        </select>

        <br><br>

        <!-- Quantity -->
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" required>

        <br><br>

        <!-- Delivery Instructions -->
        <label for="instructions">Delivery Instructions:</label>
        <br>
        <textarea id="instructions" name="instructions" rows="4" cols="40" required
            placeholder="Enter delivery instructions"></textarea>

        <br><br>

        <!-- Fixed Order ID -->
        <!-- This field is disabled so users cannot change the fixed order ID. -->
        <label for="orderId">Order ID:</label>
        <input type="text" id="orderId" name="orderId" value="ORD12345" disabled>

        <br><br>

        <button type="submit">Place Order</button>

    </form>

</body>

</html>
